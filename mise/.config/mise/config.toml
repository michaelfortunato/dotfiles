[settings]
experimental = true
pin = true
auto_install = false
exec_auto_install = false
not_found_auto_install = false
python.uv_venv_auto = false
trusted_config_paths = ["/"]
enable_tools = []

[settings.task]
run_auto_install = false

# Discovery --
# Bare `mise run` delegates to the all-workspace task picker.
[tasks.default]
hide = true
run = "mise run --all"

